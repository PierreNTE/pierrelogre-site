# Classement du mini-jeu : une lecture par jour, pour que Supabase ne mette pas le projet gratuit en pause
# (il pause les projets gratuits sans activité pendant 7 jours ; le site retombe alors sur le classement local).
# Aucune clé secrète : seulement l'adresse et la clé publique déjà présentes dans src/site.config.json.
name: Classement Supabase (anti-pause)
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture du classement
        run: |
          URL=$(jq -r '.leaderboard.supabaseUrl // empty' src/site.config.json)
          KEY=$(jq -r '.leaderboard.publishableKey // .leaderboard.anonKey // empty' src/site.config.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "classement en ligne non configuré"; exit 0; fi
          curl -fsS --max-time 20 "$URL/rest/v1/leaderboard?select=score&limit=1" -H "apikey: $KEY" > /dev/null
          echo "classement joignable"
