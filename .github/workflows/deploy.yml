
# Build, tests, puis déploiement sur OVH à chaque push sur main.
# Deux envois :
#   server/lib, cron, migrations → pierrelogre-api/ (hors du dossier public, jamais config.php)
#   site/www                 → www/ (le miroir supprime les fichiers distants absents du site local, sauf .ovhconfig)
#
# Secrets GitHub requis :
#   OVH_FTP_HOST      Nom d'hôte SFTP fourni par OVH
#   OVH_FTP_USER      Identifiant SFTP
#   OVH_FTP_PASSWORD  Mot de passe SFTP

name: Déploiement pierrelogre.com

on:
  push:
    branches: [main]
  # Une pull request lance build et tests (sans rien envoyer sur OVH : l'envoi est réservé à main)
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-${{ github.ref }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    # MySQL de test pour l'API (même version que l'hébergement OVH) ; jamais la vraie base
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      # Vérification des secrets OVH
      - name: Secrets OVH remplis ?
        env:
          HOST: ${{ secrets.OVH_FTP_HOST }}
          USER: ${{ secrets.OVH_FTP_USER }}
          PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          for v in "$HOST" "$USER" "$PASS"; do
            if [ -z "$v" ] || [ "$v" = "A_REMPLIR" ]; then
              echo "::error::Vérifie les secrets OVH dans Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      # Récupération du dépôt
      - uses: actions/checkout@v4

      # Installation de Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installation des dépendances
      - name: Installation des dépendances
        run: npm ci

      # Vérification du code
      - name: Lint
        run: npm run lint

      # Construction du site
      - name: Build du site
        run: node build.mjs

      # PHP de l'hébergement OVH (8.5), pour tester l'API
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl
          coverage: none

      # Installation de Python pour les tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tests de l'API PHP contre MySQL 8.4 (règles, filtre d'insultes, limites, classements, nettoyage)
      - name: Tests de l'API (PHP + MySQL)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: test
        run: |
          php -v | head -1
          for f in server/lib/*.php server/cron/*.php src/api/*.php; do php -l "$f"; done
          python tests/api_test.py

      # Tests automatisés Chromium
      - name: Tests (Chromium headless)
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          TEST_OUT=test-output python tests/run_all.py

      # Conservation des captures, même si les tests échouent
      - name: Captures des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: test-output

      # Déploiement SFTP sur OVH, uniquement sur main
      - name: Déploiement OVH (SFTP port 22)
        if: github.ref == 'refs/heads/main'
        env:
          HOST: ${{ secrets.OVH_FTP_HOST }}
          USER: ${{ secrets.OVH_FTP_USER }}
          PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          # Code de l'API hors du dossier public : config.php (identifiants, posé à la main) n'est jamais envoyé ni effacé
          mkdir -p deploy-api
          cp -r server/lib server/cron server/migrations server/.htaccess deploy-api/

          lftp -u "$USER","$PASS" "sftp://$HOST:22" -e "
            set sftp:auto-confirm yes;
            set cmd:fail-exit yes;
            mirror --reverse --delete --verbose --exclude-glob config.php deploy-api/ pierrelogre-api/;
            mirror --reverse --delete --verbose --exclude-glob .ovhconfig site/www/ www/;
            bye
          "
