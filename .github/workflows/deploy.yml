
# Build, tests, puis déploiement sur OVH à chaque push sur main.
# Le miroir supprime les fichiers distants absents du site local,
# sauf .ovhconfig.
#
# Secrets GitHub requis :
#   OVH_FTP_HOST      Nom d'hôte SFTP fourni par OVH
#   OVH_FTP_USER      Identifiant SFTP
#   OVH_FTP_PASSWORD  Mot de passe SFTP

name: Déploiement pierrelogre.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  build-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      # Vérification des secrets OVH
      - name: Secrets OVH remplis ?
        env:
          HOST: ${{ secrets.OVH_FTP_HOST }}
          USER: ${{ secrets.OVH_FTP_USER }}
          PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          for v in "$HOST" "$USER" "$PASS"; do
            if [ -z "$v" ] || [ "$v" = "A_REMPLIR" ]; then
              echo "::error::Vérifie les secrets OVH dans Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      # Récupération du dépôt
      - uses: actions/checkout@v4

      # Installation de Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installation des dépendances
      - name: Installation des dépendances
        run: npm ci

      # Vérification du code
      - name: Lint
        run: npm run lint

      # Construction du site
      - name: Build du site
        run: node build.mjs

      # Installation de Python pour les tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tests automatisés Chromium
      - name: Tests (Chromium headless)
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          TEST_OUT=test-output python tests/run_all.py

      # Conservation des captures, même si les tests échouent
      - name: Captures des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: test-output

      # Déploiement SFTP sur OVH, uniquement sur main
      - name: Déploiement OVH (SFTP port 22)
        if: github.ref == 'refs/heads/main'
        env:
          HOST: ${{ secrets.OVH_FTP_HOST }}
          USER: ${{ secrets.OVH_FTP_USER }}
          PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "$USER","$PASS" "sftp://$HOST:22" -e "
            set sftp:auto-confirm yes;
            set cmd:fail-exit yes;
            mirror --reverse --delete --verbose --exclude-glob .ovhconfig site/www/ www/;
            bye
          "
