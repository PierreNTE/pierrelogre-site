# =====================================================================
#  pierrelogre.com · configuration Apache pour l'hébergement OVH
# =====================================================================

# --- Pas de liste de fichiers, pas de signature serveur ---
Options -Indexes
ServerSignature Off

# --- Forcer HTTPS et l'adresse sans « www » ---
# ⚠ Active d'abord le certificat SSL (Let's Encrypt) dans l'espace client OVH,
#   sinon cette redirection mènera vers une erreur de certificat.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{SERVER_PORT} 80 [OR]
  RewriteCond %{HTTP_HOST} ^www\. [NC]
  RewriteRule ^ https://pierrelogre.com%{REQUEST_URI} [L,R=301]
</IfModule>

# --- En-têtes de sécurité ---
<IfModule mod_headers.c>
  # Le site ne charge rien d'extérieur : tout vient de pierrelogre.com.
  # Si tu ajoutes Plausible ou Umami, ajoute leur domaine à script-src et connect-src.
  Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header unset X-Powered-By

  # HSTS : le navigateur retient de toujours utiliser HTTPS (certificat Let's Encrypt actif).
  Header always set Strict-Transport-Security "max-age=31536000"

  # Cache : HTML toujours frais, le reste longtemps
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  <FilesMatch "\.(js|css)$">
    Header set Cache-Control "public, max-age=604800"
  </FilesMatch>
  <FilesMatch "\.(woff2|png|svg)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
</IfModule>

# --- Types de fichiers ---
AddType text/javascript .js .mjs
AddType font/woff2 .woff2
AddType image/svg+xml .svg
AddDefaultCharset utf-8

# --- Compression ---
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript image/svg+xml application/xml text/plain
</IfModule>

# --- Bloquer les fichiers sensibles qui traîneraient (anciens builds, sauvegardes, dépôts git) ---
RedirectMatch 404 /\.(git|svn|hg|env|DS_Store)
<FilesMatch "\.(env|bak|old|orig|sql|log|ini|sh|map|lock|yml|yaml|md)$">
  Require all denied
</FilesMatch>
<FilesMatch "^(package(-lock)?\.json|composer\.(json|lock)|\.htpasswd)$">
  Require all denied
</FilesMatch>

# --- Page d'erreur ---
ErrorDocument 404 /404.html
